name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (lint, typecheck, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The pnpm version comes from package.json's "packageManager" field.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  rust:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    env:
      # Incremental state is large and never reused on a fresh machine.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      # Dependencies are most of the build. Cargo keys a compiled crate by
      # its name, version and the compiler, not by file times, so a restored
      # cache is used for them, while this crate is rebuilt from the fresh
      # checkout. A main build fills the cache for pull requests; a changed
      # Cargo.lock starts from the newest cache for the same OS and adds
      # to it.
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
