[package]
name = "paleonyx-desktop"
version = "0.0.0"
description = "Paleonyx Studio desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

# GPU/VRAM detection is inherently platform-specific and there is no
# lightweight cross-platform crate that reports dedicated video memory
# (wgpu enumerates adapters but not their memory). Windows uses DXGI
# directly via the `windows` crate — already in the tree through Tauri,
# so this only adds a feature, not a new dependency. macOS and Linux
# report "no GPU detected" until equivalent paths are written; the fit
# heuristic degrades to CPU-only assessment rather than guessing.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[[bin]]
name = "paleonyx-desktop"
path = "src/main.rs"
