[package]
name = "paleonyx-desktop"
version = "0.0.0"
description = "Paleonyx Studio desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

# Directory walking that honours .gitignore, .ignore, and hidden-file
# rules — the crate ripgrep is built on. Worth the dependency: gitignore
# semantics are subtle (negations, anchoring, directory-only patterns),
# and a search that returns node_modules hits is not a search anyone
# would use.
ignore = "0.4"

# OS-native credential storage: Windows Credential Manager, macOS
# Keychain, Linux Secret Service. CLAUDE.md §4.2 requires a real
# credential store rather than a hand-rolled encryption scheme, and this
# is the established crate for it. `apple-native`/`windows-native`/
# `sync-secret-service` are the backends for each platform.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }

# GPU/VRAM detection is inherently platform-specific and there is no
# lightweight cross-platform crate that reports dedicated video memory
# (wgpu enumerates adapters but not their memory). Windows uses DXGI
# directly via the `windows` crate — already in the tree through Tauri,
# so this only adds a feature, not a new dependency. macOS and Linux
# report "no GPU detected" until equivalent paths are written; the fit
# heuristic degrades to CPU-only assessment rather than guessing.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[[bin]]
name = "paleonyx-desktop"
path = "src/main.rs"
